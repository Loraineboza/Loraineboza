<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#000"/>
    </radialGradient>

    <radialGradient id="syn" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="1"/>
      <stop offset="60%" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="synP" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="1"/>
      <stop offset="60%" stop-color="#a855f7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>

    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>

    <filter id="bigglow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="800" height="420" fill="url(#bg)"/>

  <!-- ===== КОНТУР МОЗГА ===== -->
  <g fill="none" stroke="#22d3ee" stroke-opacity="0.55" stroke-width="1.4">
    <!-- левое полушарие -->
    <path d="M400,60
             C 330,50 250,70 220,120
             C 195,165 205,200 195,235
             C 185,275 200,310 235,330
             C 260,345 300,345 330,335
             C 360,325 385,315 400,300"/>

    <!-- правое полушарие (зеркало) -->
    <path d="M400,60
             C 470,50 550,70 580,120
             C 605,165 595,200 605,235
             C 615,275 600,310 565,330
             C 540,345 500,345 470,335
             C 440,325 415,315 400,300"/>

    <!-- центральная борозда -->
    <path d="M400,60 L400,300" stroke-opacity="0.3"/>
  </g>

  <!-- ===== ИЗВИЛИНЫ (gyri) ===== -->
  <g fill="none" stroke="#22d3ee" stroke-opacity="0.4" stroke-width="1.1" filter="url(#soft)">
    <!-- левое -->
    <path d="M240,110 C 270,95 300,110 295,140 C 290,170 260,175 245,155"/>
    <path d="M250,190 C 285,175 320,195 310,225 C 300,255 265,250 250,230"/>
    <path d="M245,265 C 275,255 305,275 295,305 C 285,330 255,325 240,305"/>
    <path d="M300,150 C 330,140 355,160 348,185"/>
    <path d="M305,215 C 340,205 365,225 358,250"/>
    <path d="M310,280 C 345,275 370,290 362,315"/>

    <!-- правое -->
    <path d="M560,110 C 530,95 500,110 505,140 C 510,170 540,175 555,155"/>
    <path d="M550,190 C 515,175 480,195 490,225 C 500,255 535,250 550,230"/>
    <path d="M555,265 C 525,255 495,275 505,305 C 515,330 545,325 560,305"/>
    <path d="M500,150 C 470,140 445,160 452,185"/>
    <path d="M495,215 C 460,205 435,225 442,250"/>
    <path d="M490,280 C 455,275 430,290 438,315"/>
  </g>

  <!-- ===== СИНАПСЫ (узлы) ===== -->
  <g>
    <!-- левое полушарие -->
    <circle cx="255" cy="130" r="10" fill="url(#syn)">
      <animate attributeName="r" values="8;14;8" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="270" cy="205" r="10" fill="url(#syn)">
      <animate attributeName="r" values="8;14;8" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="265" cy="285" r="10" fill="url(#syn)">
      <animate attributeName="r" values="8;14;8" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="330" cy="165" r="8" fill="url(#synP)">
      <animate attributeName="r" values="6;12;6" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="338" cy="235" r="8" fill="url(#synP)">
      <animate attributeName="r" values="6;12;6" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="335" cy="295" r="8" fill="url(#syn)">
      <animate attributeName="r" values="6;12;6" dur="2.9s" repeatCount="indefinite"/>
    </circle>

    <!-- правое полушарие -->
    <circle cx="545" cy="130" r="10" fill="url(#syn)">
      <animate attributeName="r" values="8;14;8" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="530" cy="205" r="10" fill="url(#syn)">
      <animate attributeName="r" values="8;14;8" dur="2.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="535" cy="285" r="10" fill="url(#syn)">
      <animate attributeName="r" values="8;14;8" dur="2.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="470" cy="165" r="8" fill="url(#synP)">
      <animate attributeName="r" values="6;12;6" dur="2.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="462" cy="235" r="8" fill="url(#synP)">
      <animate attributeName="r" values="6;12;6" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="465" cy="295" r="8" fill="url(#syn)">
      <animate attributeName="r" values="6;12;6" dur="3.1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ===== ИМПУЛЬСЫ, БЕГУЩИЕ ПО СВЯЗЯМ ===== -->
  <g fill="#22d3ee">
    <!-- левое -->
    <circle r="2.5"><animateMotion dur="2.4s" repeatCount="indefinite" path="M255,130 Q 290,150 330,165"/></circle>
    <circle r="2.5"><animateMotion dur="2.8s" repeatCount="indefinite" path="M270,205 Q 305,220 338,235"/></circle>
    <circle r="2.5"><animateMotion dur="2.6s" repeatCount="indefinite" path="M265,285 Q 300,295 335,295"/></circle>
    <circle r="2.5"><animateMotion dur="3.2s" repeatCount="indefinite" path="M330,165 Q 335,200 338,235"/></circle>
    <circle r="2.5"><animateMotion dur="3.0s" repeatCount="indefinite" path="M338,235 Q 340,265 335,295"/></circle>

    <!-- правое -->
    <circle r="2.5"><animateMotion dur="2.5s" repeatCount="indefinite" path="M545,130 Q 510,150 470,165"/></circle>
    <circle r="2.5"><animateMotion dur="2.9s" repeatCount="indefinite" path="M530,205 Q 495,220 462,235"/></circle>
    <circle r="2.5"><animateMotion dur="2.7s" repeatCount="indefinite" path="M535,285 Q 500,295 465,295"/></circle>
    <circle r="2.5"><animateMotion dur="3.1s" repeatCount="indefinite" path="M470,165 Q 465,200 462,235"/></circle>
    <circle r="2.5"><animateMotion dur="2.9s" repeatCount="indefinite" path="M462,235 Q 460,265 465,295"/></circle>
  </g>

  <!-- межполушарные импульсы (фиолетовые) -->
  <g fill="#a855f7">
    <circle r="2.5"><animateMotion dur="3.4s" repeatCount="indefinite" path="M330,165 Q 400,150 470,165"/></circle>
    <circle r="2.5"><animateMotion dur="3.8s" repeatCount="indefinite" path="M338,235 Q 400,225 462,235"/></circle>
    <circle r="2.5"><animateMotion dur="3.6s" repeatCount="indefinite" path="M335,295 Q 400,285 465,295"/></circle>
  </g>

  <!-- ===== ПУЛЬСИРУЮЩЕЕ ЯДРО В ЦЕНТРЕ ===== -->
  <circle cx="400" cy="180" r="18" fill="url(#synP)" filter="url(#bigglow)">
    <animate attributeName="r" values="14;26;14" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- тонкая окантовка по краям -->
  <rect x="1" y="1" width="798" height="418" fill="none" stroke="#18181b" stroke-width="2" rx="12"/>
</svg>
