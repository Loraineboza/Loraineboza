```svg
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="220" viewBox="0 0 800 220">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset=".5" stop-color="#0b1028"/>
      <stop offset="1" stop-color="#03050f"/>
    </linearGradient>

    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#5ee7ff" stop-opacity="0"/>
      <stop offset=".3" stop-color="#5ee7ff"/>
      <stop offset=".7" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="core">
      <stop stop-color="#fff" stop-opacity="1"/>
      <stop offset=".18" stop-color="#7dd3fc" stop-opacity=".95"/>
      <stop offset=".55" stop-color="#8b5cf6" stop-opacity=".3"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="soft" x="-50%" y="-100%" width="200%" height="300%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>

    <style>
      .edge {
        fill:none;
        stroke:url(#flow);
        stroke-width:1;
        stroke-linecap:round;
        opacity:.18;
      }
      .node {
        fill:#0b1028;
        stroke:#67e8f9;
        stroke-width:1.2;
        filter:url(#glow);
      }
      .pulse {
        fill:#fff;
        filter:url(#glow);
      }
      .orb {
        fill:none;
        stroke:#8b5cf6;
        stroke-width:1;
        opacity:.25;
      }
    </style>
  </defs>

  <!-- atmospheric field -->
  <rect width="800" height="220" rx="18" fill="url(#bg)"/>

  <ellipse cx="400" cy="110" rx="290" ry="82"
           fill="none" stroke="#4f46e5" stroke-width="18"
           opacity=".045" filter="url(#soft)">
    <animate attributeName="rx" values="250;320;250" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="ry" values="65;92;65" dur="8s" repeatCount="indefinite"/>
  </ellipse>

  <!-- neural pathways -->
  <g>
    <!-- layer 1 -> layer 2 -->
    <path class="edge" d="M100 48 Q220 35 335 58"/>
    <path class="edge" d="M100 48 Q220 82 335 58"/>
    <path class="edge" d="M100 48 Q220 125 335 110"/>
    <path class="edge" d="M100 110 Q220 55 335 58"/>
    <path class="edge" d="M100 110 Q220 100 335 110"/>
    <path class="edge" d="M100 110 Q220 150 335 162"/>
    <path class="edge" d="M100 172 Q220 95 335 58"/>
    <path class="edge" d="M100 172 Q220 135 335 110"/>
    <path class="edge" d="M100 172 Q220 170 335 162"/>

    <!-- layer 2 -> core -->
    <path class="edge" d="M335 58 Q400 75 400 110"/>
    <path class="edge" d="M335 110 Q400 110 400 110"/>
    <path class="edge" d="M335 162 Q400 145 400 110"/>

    <!-- core -> layer 3 -->
    <path class="edge" d="M400 110 Q470 75 535 58"/>
    <path class="edge" d="M400 110 Q470 110 535 110"/>
    <path class="edge" d="M400 110 Q470 145 535 162"/>

    <!-- layer 3 -> layer 4 -->
    <path class="edge" d="M535 58 Q650 35 700 48"/>
    <path class="edge" d="M535 58 Q650 82 700 110"/>
    <path class="edge" d="M535 110 Q650 55 700 48"/>
    <path class="edge" d="M535 110 Q650 100 700 110"/>
    <path class="edge" d="M535 110 Q650 150 700 172"/>
    <path class="edge" d="M535 162 Q650 95 700 48"/>
    <path class="edge" d="M535 162 Q650 135 700 110"/>
    <path class="edge" d="M535 162 Q650 170 700 172"/>
  </g>

  <!-- travelling synaptic pulses -->
  <g class="pulse">
    <circle r="2">
      <animateMotion dur="3.8s" repeatCount="indefinite" path="M100 48 Q220 35 335 58"/>
    </circle>
    <circle r="1.7">
      <animateMotion dur="3.1s" begin=".7s" repeatCount="indefinite" path="M100 110 Q220 100 335 110"/>
    </circle>
    <circle r="2">
      <animateMotion dur="4.2s" begin="1.4s" repeatCount="indefinite" path="M100 172 Q220 135 335 110"/>
    </circle>
    <circle r="2.2">
      <animateMotion dur="2.5s" begin=".2s" repeatCount="indefinite" path="M335 58 Q400 75 400 110"/>
    </circle>
    <circle r="2">
      <animateMotion dur="2.9s" begin="1s" repeatCount="indefinite" path="M335 162 Q400 145 400 110"/>
    </circle>
    <circle r="2.3">
      <animateMotion dur="3s" begin=".5s" repeatCount="indefinite" path="M400 110 Q470 75 535 58"/>
    </circle>
    <circle r="1.8">
      <animateMotion dur="3.6s" begin="1.8s" repeatCount="indefinite" path="M400 110 Q470 145 535 162"/>
    </circle>
    <circle r="2">
      <animateMotion dur="3.5s" begin="1.1s" repeatCount="indefinite" path="M535 58 Q650 82 700 110"/>
    </circle>
    <circle r="1.7">
      <animateMotion dur="4s" begin=".4s" repeatCount="indefinite" path="M535 162 Q650 135 700 110"/>
    </circle>
  </g>

  <!-- subtle data streams -->
  <g fill="none" stroke="url(#flow)" stroke-width=".7" opacity=".18">
    <path d="M25 92 C150 20 230 200 350 95 S590 25 775 120">
      <animate attributeName="d"
        values="M25 92 C150 20 230 200 350 95 S590 25 775 120;
                M25 120 C150 200 230 20 350 125 S590 195 775 92;
                M25 92 C150 20 230 200 350 95 S590 25 775 120"
        dur="11s" repeatCount="indefinite"/>
    </path>
    <path d="M25 135 C150 210 240 30 360 125 S590 190 775 82">
      <animate attributeName="d"
        values="M25 135 C150 210 240 30 360 125 S590 190 775 82;
                M25 82 C150 30 240 190 360 95 S590 30 775 135;
                M25 135 C150 210 240 30 360 125 S590 190 775 82"
        dur="14s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- nodes -->
  <g>
    <g>
      <circle class="node" cx="100" cy="48" r="5"/>
      <circle class="node" cx="100" cy="110" r="5"/>
      <circle class="node" cx="100" cy="172" r="5"/>
      <circle class="node" cx="335" cy="58" r="6"/>
      <circle class="node" cx="335" cy="110" r="6"/>
      <circle class="node" cx="335" cy="162" r="6"/>
      <circle class="node" cx="535" cy="58" r="6"/>
      <circle class="node" cx="535" cy="110" r="6"/>
      <circle class="node" cx="535" cy="162" r="6"/>
      <circle class="node" cx="700" cy="48" r="5"/>
      <circle class="node" cx="700" cy="110" r="5"/>
      <circle class="node" cx="700" cy="172" r="5"/>
    </g>

    <!-- breathing nodes -->
    <g fill="none" stroke="#67e8f9">
      <circle cx="100" cy="48" r="8" opacity=".15">
        <animate attributeName="r" values="7;15;7" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".2;0;.2" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="335" cy="110" r="9" opacity=".18">
        <animate attributeName="r" values="8;18;8" dur="3.7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".2;0;.2" dur="3.7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="535" cy="110" r="9" opacity=".18">
        <animate attributeName="r" values="8;18;8" dur="4.1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".2;0;.2" dur="4.1s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- central intelligence core -->
  <g>
    <circle cx="400" cy="110" r="42" fill="url(#core)" opacity=".16">
      <animate attributeName="r" values="32;48;32" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".12;.24;.12" dur="5s" repeatCount="indefinite"/>
    </circle>

    <circle cx="400" cy="110" r="17" fill="url(#core)" filter="url(#glow)">
      <animate attributeName="r" values="13;19;13" dur="3.5s" repeatCount="indefinite"/>
    </circle>

    <circle class="orb" cx="400" cy="110" r="28">
      <animateTransform attributeName="transform"
        type="rotate" from="0 400 110" to="360 400 110"
        dur="7s" repeatCount="indefinite"/>
    </circle>

    <circle class="orb" cx="400" cy="110" r="35"
            stroke="#67e8f9" stroke-dasharray="2 9">
      <animateTransform attributeName="transform"
        type="rotate" from="360 400 110" to="0 400 110"
        dur="10s" repeatCount="indefinite"/>
    </circle>

    <circle cx="400" cy="110" r="4" fill="#fff" filter="url(#glow)">
      <animate attributeName="r" values="3;6;3" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- orbiting particles -->
  <g fill="#a78bfa" filter="url(#glow)">
    <circle r="2">
      <animateMotion dur="6s" repeatCount="indefinite"
        path="M400 75 A35 35 0 1 1 399.9 75"/>
    </circle>
    <circle r="1.5" fill="#67e8f9">
      <animateMotion dur="4.5s" begin="1s" repeatCount="indefinite"
        path="M400 145 A35 35 0 1 1 400.1 145"/>
    </circle>
  </g>

  <!-- tiny ambient particles -->
  <g fill="#67e8f9">
    <circle cx="55" cy="28" r="1">
      <animate attributeName="opacity" values=".1;.8;.1" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="180" cy="190" r="1">
      <animate attributeName="opacity" values=".8;.1;.8" dur="3.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="620" cy="25" r="1">
      <animate attributeName="opacity" values=".1;.8;.1" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="755" cy="190" r="1">
      <animate attributeName="opacity" values=".8;.1;.8" dur="3.2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
