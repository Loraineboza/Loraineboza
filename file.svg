<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- Градиенты для трассы -->
    <linearGradient id="trackGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#16213e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f3460;stop-opacity:1" />
    </linearGradient>
    
    <!-- Градиент для машины -->
    <linearGradient id="carGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e94560;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e94560;stop-opacity:1" />
    </linearGradient>
    
    <!-- Свечение -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- 3D перспектива -->
    <linearGradient id="perspectiveGradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#0a0a0a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:0.3" />
    </linearGradient>
  </defs>
  
  <!-- Фон -->
  <rect width="800" height="600" fill="url(#trackGradient)"/>
  
  <!-- Сетка трассы с 3D эффектом -->
  <g filter="url(#glow)">
    <path d="M 0 400 L 800 400" stroke="#e94560" stroke-width="2" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M 0 450 L 800 450" stroke="#e94560" stroke-width="2" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="2s" begin="0.2s" repeatCount="indefinite"/>
    </path>
    <path d="M 0 500 L 800 500" stroke="#e94560" stroke-width="2" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="2s" begin="0.4s" repeatCount="indefinite"/>
    </path>
    
    <!-- Вертикальные линии перспективы -->
    <path d="M 200 300 L 150 600" stroke="#e94560" stroke-width="1.5" opacity="0.4"/>
    <path d="M 400 300 L 400 600" stroke="#e94560" stroke-width="1.5" opacity="0.4"/>
    <path d="M 600 300 L 650 600" stroke="#e94560" stroke-width="1.5" opacity="0.4"/>
  </g>
  
  <!-- Анимированная гоночная машина F1 -->
  <g filter="url(#glow)">
    <g>
      <!-- Траектория движения -->
      <animateTransform attributeName="transform" type="translate" values="-100 450; 900 450; -100 450" dur="3s" repeatCount="indefinite"/>
      
      <!-- Корпус машины -->
      <ellipse cx="50" cy="450" rx="60" ry="15" fill="url(#carGradient)">
        <animate attributeName="ry" values="15;18;15" dur="0.3s" repeatCount="indefinite"/>
      </ellipse>
      
      <!-- Кокпит -->
      <ellipse cx="50" cy="445" rx="20" ry="8" fill="#0a0a0a"/>
      
      <!-- Переднее антикрыло -->
      <rect x="10" y="455" width="80" height="4" fill="#e94560" rx="2">
        <animate attributeName="y" values="455;458;455" dur="0.2s" repeatCount="indefinite"/>
      </rect>
      
      <!-- Заднее антикрыло -->
      <rect x="30" y="435" width="40" height="5" fill="#e94560" rx="2">
        <animate attributeName="y" values="435;432;435" dur="0.2s" repeatCount="indefinite"/>
      </rect>
      
      <!-- Колеса -->
      <ellipse cx="20" cy="460" rx="8" ry="12" fill="#1a1a1a">
        <animateTransform attributeName="transform" type="rotate" values="0 20 460; 360 20 460" dur="0.5s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="80" cy="460" rx="8" ry="12" fill="#1a1a1a">
        <animateTransform attributeName="transform" type="rotate" values="0 80 460; 360 80 460" dur="0.5s" repeatCount="indefinite"/>
      </ellipse>
      
      <!-- След от скорости -->
      <path d="M -50 450 L 10 450" stroke="#e94560" stroke-width="3" stroke-linecap="round" opacity="0.6">
        <animate attributeName="opacity" values="0.6;0;0.6" dur="0.5s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>
  
  <!-- Движущиеся элементы трассы -->
  <g>
    <rect x="0" y="520" width="20" height="3" fill="#ffffff" opacity="0.5">
      <animate attributeName="x" values="0;820;0" dur="1.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="100" y="520" width="20" height="3" fill="#ffffff" opacity="0.5">
      <animate attributeName="x" values="100;920;100" dur="1.5s" begin="0.3s" repeatCount="indefinite"/>
    </rect>
    <rect x="200" y="520" width="20" height="3" fill="#ffffff" opacity="0.5">
      <animate attributeName="x" values="200;1020;200" dur="1.5s" begin="0.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="300" y="520" width="20" height="3" fill="#ffffff" opacity="0.5">
      <animate attributeName="x" values="300;1120;300" dur="1.5s" begin="0.9s" repeatCount="indefinite"/>
    </rect>
    <rect x="400" y="520" width="20" height="3" fill="#ffffff" opacity="0.5">
      <animate attributeName="x" values="400;1220;400" dur="1.5s" begin="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>
  
  <!-- Частицы скорости -->
  <g filter="url(#glow)">
    <circle cx="100" cy="400" r="3" fill="#e94560" opacity="0">
      <animate attributeName="cx" values="100;800;100" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="420" r="2" fill="#ff6b6b" opacity="0">
      <animate attributeName="cx" values="200;900;200" dur="1.8s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="1.8s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="380" r="4" fill="#e94560" opacity="0">
      <animate attributeName="cx" values="300;1000;300" dur="2.2s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="2.2s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- 3D эффект глубины -->
  <rect width="800" height="600" fill="url(#perspectiveGradient)" pointer-events="none"/>
  
  <!-- Дополнительные гоночные элементы -->
  <g filter="url(#glow)">
    <!-- Болид на заднем плане -->
    <g opacity="0.4">
      <animateTransform attributeName="transform" type="translate" values="-150 430; 950 430; -150 430" dur="4s" repeatCount="indefinite"/>
      <ellipse cx="50" cy="430" rx="40" ry="10" fill="#ff6b6b"/>
      <ellipse cx="20" cy="438" rx="5" ry="8" fill="#1a1a1a"/>
      <ellipse cx="80" cy="438" rx="5" ry="8" fill="#1a1a1a"/>
    </g>
  </g>
</svg>
